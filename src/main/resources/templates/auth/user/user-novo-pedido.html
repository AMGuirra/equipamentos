<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Pedido</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
	integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" th:href="@{/bootstrap-5.1.3-dist/css/styles.css}">
<script th:src="@{/js/theme.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<style>
.mensagem {
	color: red;
}
</style>
</head>
<body>
	<div class="container">
		<div class="row" style="padding-bottom: 30px;">
			<div class="col">
				<h2 th:text="#{pedido.cadastro}"></h2>
				<!-- Mensagem de sucesso ou erro aqui -->
				<form action="#" method="post">
					<div class="row mb-3">
						<label for="id" class="col-sm-1 col-form-label">ID:</label>
						<div class="col-sm-5">
							<input type="text" class="form-control" id="id" name="id">
						</div>
					</div>
					<div class="row mb-3">
						<label for="dataEmprestimo" class="col-sm-1 col-form-label">Data
							de Empréstimo:</label>
						<div class="col-sm-5">
							<input type="date" class="form-control" id="dataEmprestimo"
								name="dataEmprestimo">
						</div>
					</div>
					<div class="row mb-3">
						<label for="dataDevolucao" class="col-sm-1 col-form-label">Data
							de Devolução:</label>
						<div class="col-sm-5">
							<input type="date" class="form-control" id="dataDevolucao"
								name="dataDevolucao">
						</div>
					</div>
					<div class="row mb-3">
						<label for="usuario" class="col-sm-1 col-form-label">Usuário:</label>
						<div class="col-sm-5">
							<input type="text" class="form-control" id="usuario"
								name="usuario">
						</div>
					</div>
					<div class="row mb-3">
						<label for="equipamento" class="col-sm-1 col-form-label">Equipamento:</label>
						<div class="col-sm-5">
							<input type="text" class="form-control" id="equipamento"
								name="equipamento">
						</div>
					</div>
					<button type="submit" class="btn btn-primary">Enviar</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
