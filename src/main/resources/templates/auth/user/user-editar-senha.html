<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{auth.nav.password}">Editar senha</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script th:src="@{/js/theme.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" th:href="@{/bootstrap-5.1.3-dist/css/styles.css}">

<style>
.mensagem {
	color: red;
}
</style>
</head>
<body>
	<div th:replace="auth/auth-generica-nav :: navGenerica"></div>
	<div class="container">
		<div class="row">
			<div class="col">
				<h2 th:text="#{auth.nav.password}">Editar senha</h2>
				<form th:action="@{/usuario/editarSenha/{id}(id=${usuario.id})}" method="post">
					<div class="row mb-3">
						<label class="col-sm-1 col-form-label" for="password" th:text="#{form.password}">Senha</label>
						<div class="col-sm-2">
							<input class="form-control" id="password" name="password" type="password">
						</div>
						<div class="col-sm-5">
							<span class="mensagem" th:if="${erroSenha}" th:text="${erroSenha}"></span>
						</div>
					</div>

					<input class="btn btn-primary" type="submit" th:value="#{user.alterar.usuario.edit.button}" />
				</form>
			</div>
		</div>
	</div>

</body>
</html>
