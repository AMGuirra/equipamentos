<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />

<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Lista de Pedidos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script th:src="@{/js/theme.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" th:href="@{/bootstrap-5.1.3-dist/css/styles.css}">

</head>
<body>
	<div th:replace="auth/auth-generica-nav :: navGenerica"></div>
	<div class="container">
		<div class="row">

			<div class="col">
				<h1 th:text="#{pedido.list}"></h1>

				<div class="mb-3">
					<a th:href="@{/equipamento/listar}" class="btn btn-primary"
						th:text="#{button.pedido}"></a>
				</div>

				<table class="table table-striped table-hover align-middle">
					<thead>
						<tr>
							<th th:text="#{usuario.id}"></th>
							<th th:text="#{pedido.usuario.nome}"></th>
							<th th:text="#{pedido.date}"></th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${pedido.empty}">
							<td colspan="2" th:text="#{pedido.no}"></td>
						</tr>
						<tr th:each="pedido : ${pedido}">
							<td><span th:text="${pedido.id}"></span></td>
							<td><span th:text="${pedido.nome}"></span></td>
							<td><span th:text="${pedido.data}"></span></td>
							<td><a class="btn btn-outline-primary btn-sm"
								th:href="@{/pedido/ver/{id}/{data}(id=${pedido.id}, data=${pedido.data})}"
								th:text="#{pedido.ver}"> </a></td>
							<!--  
				<td>
					<a class="btn btn-outline-danger btn-sm" 
					   th:href="@{/pedido/apagar/{id}(id=${pedido.id})}"
					   th:data-confirm-delete="|Você gostaria de apagar?|"
  					   onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false"
  					   th:text="#{pedido.delete}">
					</a>
				</td>				
				<td>
					<a class="btn btn-outline-primary btn-sm" 
					   th:href="@{/pedido/ver}"
					   th:text="#{button.ver.pedido}">
					</a>
				</td>
				
				-->
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>


</body>
</html>
