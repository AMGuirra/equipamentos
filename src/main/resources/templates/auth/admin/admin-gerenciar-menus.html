<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciar Menus</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script th:src="@{/js/theme.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<link rel="stylesheet" th:href="@{/bootstrap-5.1.3-dist/css/styles.css}">
</head>
<body>
	<div th:replace="auth/auth-generica-nav :: navGenerica"></div>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-10">
				<div class="card">
					<div class="card-header bg-primary text-white">
						<h1 th:text="#{menu.permissao.title}"></h1>
					</div>
					<div class="card-body">
						<div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show">
							<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
							<span th:text="${mensagem}"></span>
						</div>

						<form th:action="@{/admin/menus}" method="post">
							<table class="table table-striped table-hover align-middle">
								<thead>
									<tr>
										<th th:text="#{menu.permissao.menu}"></th>
										<th th:each="papel : ${papeis}" th:text="${papel.papel}"></th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="menu : ${menus}">
										<td th:text="${menu.nome}"></td>
										<td th:each="papel : ${papeis}">
											<div class="form-check form-switch">
												<input class="form-check-input" type="checkbox" name="permitidos"
													th:id="|${papel.papel}-${menu.chave}|"
													th:value="${@menuPermissaoService.chaveFormulario(papel.papel, menu.chave)}"
													th:checked="${@menuPermissaoService.temPermissao(papel.papel, menu.chave)}">
												<label class="form-check-label" th:for="|${papel.papel}-${menu.chave}|"
													th:text="#{menu.permissao.allow}"></label>
											</div>
										</td>
									</tr>
								</tbody>
							</table>

							<div class="d-flex gap-2">
								<button type="submit" class="btn btn-primary" th:text="#{menu.permissao.save}"></button>
								<a th:href="@{/usuario/index}" class="btn btn-outline-secondary" th:text="#{button.cancelar}"></a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
